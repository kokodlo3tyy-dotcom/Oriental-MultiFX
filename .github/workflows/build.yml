name: Build VST3
on: [push, workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release

      - name: Upload Ready VST3 File
        uses: actions/upload-artifact@v4
        with:
          name: Oriental_MultiFX_VST3
          path: build/OrientalMultiFX_artefacts/Release/VST3/Oriental Multi-Effect.vst3/Contents/x86_64-win/Oriental Multi-Effect.vst3
